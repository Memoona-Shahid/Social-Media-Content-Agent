<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ page_title }} · {{ app_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />
  </head>
  <body>
    <div class="frame">
      <header class="masthead">
        <a class="mark" href="/">
          <span class="mark__glyph" aria-hidden="true">CA</span>
          <span class="mark__copy">
            <strong>{{ app_name }}</strong>
            <small>Content studio</small>
          </span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a class="nav__link {% if active_nav == 'studio' %}is-active{% endif %}" href="/">Studio</a>
          <a class="nav__link {% if active_nav == 'compose' %}is-active{% endif %}" href="/compose">Compose</a>
          <a class="nav__link {% if active_nav == 'output' %}is-active{% endif %}" href="/output">Output</a>
          <a class="nav__link {% if active_nav == 'profile' %}is-active{% endif %}" href="/profile">Brand Voice</a>
        </nav>
        <p class="env-chip" title="Current application environment">{{ app_env }}</p>
      </header>

      <main class="stage">
        {% block content %}{% endblock %}
      </main>

      <footer class="colophon">
        <p>{{ app_name }} v{{ app_version }}</p>
        <p>Local FastAPI workspace</p>
      </footer>
    </div>
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
  </body>
</html>
